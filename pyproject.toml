[project]
name = "fanfare-studio"
version = "1.0.0"
description = "Local text-to-speech server for the Fanfare browser app (proof of concept)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.14"
# The server is otherwise stdlib-only; model backends are extras. The PerTh watermarker is REQUIRED
# (every clip is watermarked; no watermarker = the server refuses to start). It imports torch and
# librosa, so pick a torch flavour with exactly one of --extra cpu / cuda / rocm (see README).
# setuptools<81: resemble-perth still imports pkg_resources.
dependencies = [
  "platformdirs>=4",
  "resemble-perth==1.0.1",
  "setuptools<81",
  "numpy",
  "librosa",
  "torch==2.6.0",
]

[project.optional-dependencies]
# High-quality model (PyTorch). Combine with exactly one of cpu / cuda / rocm on Linux/Windows.
chatterbox = ["chatterbox-tts==0.1.7"]
cpu = ["torch==2.6.0", "torchaudio==2.6.0", "torchvision==0.21.0"]
cuda = ["torch==2.6.0", "torchaudio==2.6.0", "torchvision==0.21.0"]
rocm = ["torch==2.6.0", "torchaudio==2.6.0", "torchvision==0.21.0", "pytorch-triton-rocm"]
# Portable ONNX Runtime backends (CPU everywhere; GPU/NPU via execution providers).
piper = ["piper-tts>=1.3", "onnxruntime>=1.22"]
onnx = ["onnxruntime>=1.22", "numpy", "librosa", "tokenizers", "huggingface-hub"]
# Automatic quality evaluation / tuning (dev + power users). Needs torch: add --extra cpu (or rocm/cuda).
# faster-whisper (MIT; bundles Silero VAD, MIT), SpeechBrain ECAPA (Apache-2.0), UTMOSv2 (MIT code + weights)
eval = [
  "faster-whisper>=1.2",
  "speechbrain>=1.0",
  "utmosv2 @ git+https://github.com/sarulab-speech/UTMOSv2.git@cc2700db57bb83ee13dc31ebe1b868c254e15d09",
  "soundfile",
]

[project.scripts]
fanfare-studio = "fanfare_studio.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fanfare_studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# slow: builds and starts the release package (downloads dependencies); run with  pytest -m slow
markers = ["slow: builds and starts the release package"]
addopts = "-m 'not slow'"

# --- PyTorch wheel selection --------------------------------------------------
# macOS: plain PyPI torch (MPS built in) -> use `--extra chatterbox --extra cpu`.
[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }, { extra = "rocm" }]]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
  { index = "pytorch-cu124", extra = "cuda" },
  { index = "pytorch-rocm", extra = "rocm" },
]
torchaudio = [
  { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
  { index = "pytorch-cu124", extra = "cuda" },
  { index = "pytorch-rocm", extra = "rocm" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
  { index = "pytorch-cu124", extra = "cuda" },
  { index = "pytorch-rocm", extra = "rocm" },
]
pytorch-triton-rocm = [{ index = "pytorch-rocm", extra = "rocm" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm6.2.4"
explicit = true

[tool.hatch.metadata]
allow-direct-references = true
