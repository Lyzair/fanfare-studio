# AMD GPU override (PyTorch ROCm; Chatterbox on torch). EXPERIMENTAL.
#   export VIDEO_GID=$(getent group video | cut -d: -f3) RENDER_GID=$(getent group render | cut -d: -f3)
#   docker compose -f compose.yaml -f compose.rocm.yaml up -d --build
# Note: ONNX Runtime on ROCm produced garbled audio in our tests, hence the torch backend here.
services:
  fanfare-studio:
    build:
      args:
        TORCH_EXTRA: rocm
        EXTRAS: chatterbox
    image: fanfare-studio:rocm
    command: ["--backend", "chatterbox", "--device", "rocm"]
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:   # numeric host GIDs (names may not exist in the image): getent group video render
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-109}"
