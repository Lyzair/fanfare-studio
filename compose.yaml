# Fanfare Studio, CPU (default: Chatterbox 4-bit ONNX, the best-sounding path in our listening tests).
#   docker compose up -d --build
# The port is published on the host's 127.0.0.1 ONLY. Never change it to "5123:5123" / 0.0.0.0.
services:
  fanfare-studio:
    build:
      context: .
      args:
        TORCH_EXTRA: cpu
        EXTRAS: onnx
    # FANFARE_STUDIO_IMAGE=ghcr.io/lyzair/fanfare-studio:1 with --no-build uses the published image
    image: ${FANFARE_STUDIO_IMAGE:-fanfare-studio:local}
    ports:
      - "127.0.0.1:5123:5123"
    environment:
      # Websites allowed to use the server (comma-separated, exact match; localhost always works).
      # There is no interactive prompt in a container; alternatively use
      #   docker compose exec fanfare-studio fanfare-studio allow https://you.github.io
      FANFARE_ALLOWED_ORIGINS: "${FANFARE_ALLOWED_ORIGINS:-}"
      HF_HUB_DISABLE_TELEMETRY: "1"
    volumes:
      - models:/models         # model downloads (about 3 GB), kept across rebuilds
      - references:/data       # club voices (consented reference clips)
      - config:/config         # allowed-origins.toml
    read_only: true
    tmpfs:
      - /tmp
      - /home/fanfare:uid=10001,gid=10001   # some libraries (chatterbox torch: pkuseg) write caches to $HOME
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:   # same as the Dockerfile HEALTHCHECK (also applies to images built in OCI format)
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:5123/voices', timeout=4).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 900s
    restart: unless-stopped

volumes:
  models:
  references:
  config:
